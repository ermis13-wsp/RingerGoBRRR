name: Build RINGER GO BRRR

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:       # allows manual trigger from the Actions tab

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build iOS App (unsigned .app)
    runs-on: macos-14          # Apple Silicon runner; ships Xcode 15+

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode ──────────────────────────────────────────────────────
      # macos-14 ships multiple Xcode versions.  We pick the newest stable one.
      # Adjust the version string if Apple ships a newer one by the time you run this.
      - name: Select Xcode version
        run: |
          # List available Xcode installations for debugging
          ls /Applications/ | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      # ── 3. Generate app icon ─────────────────────────────────────────────────
      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate app icon
        run: python scripts/generate_icon.py

      - name: Verify icon was created
        run: |
          ls -la "RingerGoBRRR/Assets.xcassets/AppIcon.appiconset/"
          file "RingerGoBRRR/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

      # ── 4. Build (no signing) ────────────────────────────────────────────────
      # We build for the generic iOS simulator SDK first as a compile check,
      # then build for the real device SDK with code signing disabled.
      # The result is an unsigned .app bundle suitable for Sideloadly.

      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild \
            -project RingerGoBRRR.xcodeproj \
            -scheme RingerGoBRRR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            | xcpretty --color || true
          # Fall back to raw output if xcpretty not available
          xcodebuild \
            -project RingerGoBRRR.xcodeproj \
            -scheme RingerGoBRRR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tail -20

      # ── 5. Locate the built .app ─────────────────────────────────────────────
      - name: Find built .app bundle
        id: find_app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "RingerGoBRRR.app" -type d \
            -path "*/Release-iphoneos/*" \
            2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            # Fallback: search build folder in workspace
            APP_PATH=$(find . -name "RingerGoBRRR.app" -type d 2>/dev/null | head -1)
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH" || echo "Warning: could not list app contents"

      # ── 6. Package .app into a zip for Sideloadly ────────────────────────────
      # Sideloadly accepts either a .ipa or a zipped .app.
      # A .ipa is just a zip with the .app inside a Payload/ folder.
      - name: Package as .ipa (Payload zip)
        run: |
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"

          mkdir -p "$RUNNER_TEMP/ipa_staging/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa_staging/Payload/RingerGoBRRR.app"

          cd "$RUNNER_TEMP/ipa_staging"
          zip -r "$RUNNER_TEMP/RingerGoBRRR-unsigned.ipa" Payload/

          echo "IPA created:"
          ls -lh "$RUNNER_TEMP/RingerGoBRRR-unsigned.ipa"

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RingerGoBRRR-unsigned-ipa
          path: ${{ runner.temp }}/RingerGoBRRR-unsigned.ipa
          retention-days: 30

      # ── 8. Also upload the raw .app bundle as a separate artifact ────────────
      - name: Upload raw .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: RingerGoBRRR-app-bundle
          path: ${{ steps.find_app.outputs.APP_PATH }}
          retention-days: 30

      # ── 9. Print build summary ───────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "============================================"
          echo "  RINGER GO BRRR — Build Complete"
          echo "============================================"
          echo ""
          echo "  Artifact: RingerGoBRRR-unsigned-ipa"
          echo "  File:     RingerGoBRRR-unsigned.ipa"
          echo ""
          echo "  To install on your iPhone 15:"
          echo "  1. Download RingerGoBRRR-unsigned.ipa"
          echo "     from the Actions artifacts panel."
          echo "  2. Open Sideloadly on Windows."
          echo "  3. Connect iPhone via USB."
          echo "  4. Drag the .ipa into Sideloadly."
          echo "  5. Enter your Apple ID (free account works)."
          echo "  6. Sideloadly signs the app and installs it."
          echo "  7. On iPhone: Settings > General >"
          echo "     VPN & Device Management > Trust your Apple ID."
          echo ""
          echo "  NOTE: Free Apple ID provisioning expires in 7 days."
          echo "  A paid developer account gives 1-year validity."
          echo "============================================"
