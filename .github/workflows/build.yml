name: Build RINGER GO BRRR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (unsigned .ipa)
    runs-on: macos-14

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode ───────────────────────────────────────────────────
      - name: Select Xcode version
        run: |
          echo "Available Xcode installs:"
          ls /Applications/ | grep -i xcode || true

          # Try versions in descending preference order
          for ver in 16.2 16.1 16.0 15.4 15.3 15.2 15.1 15.0; do
            if [ -d "/Applications/Xcode_${ver}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${ver}.app/Contents/Developer"
              echo "Selected Xcode ${ver}"
              break
            fi
          done

          xcodebuild -version
          swift --version

      # ── 3. Generate app icon ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate app icon
        run: python scripts/generate_icon.py

      - name: Verify icon PNG exists
        run: |
          ICON="RingerGoBRRR/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "ERROR: App icon was not generated."
            exit 1
          fi
          ls -lh "$ICON"
          file "$ICON"

      # ── 4. Build ──────────────────────────────────────────────────────────
      # -derivedDataPath pins output to a known location.
      # CODE_SIGNING_ALLOWED=NO produces an unsigned .app.
      # SKIP_INSTALL=NO + BUILD_LIBRARY_FOR_DISTRIBUTION=NO keeps the full app bundle.
      - name: Build for iOS device (unsigned)
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -project RingerGoBRRR.xcodeproj \
            -scheme RingerGoBRRR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          echo "xcodebuild exit code: $?"

      # ── 5. Locate .app at the deterministic path ──────────────────────────
      - name: Locate .app bundle
        id: locate_app
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          APP_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos"

          echo "Contents of Release-iphoneos:"
          ls -la "$APP_DIR" || { echo "ERROR: Release-iphoneos directory not found."; exit 1; }

          APP_PATH="$APP_DIR/RingerGoBRRR.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: RingerGoBRRR.app not found at expected path: $APP_PATH"
            echo "Searching entire DerivedData tree for any .app:"
            find "$DERIVED_DATA" -name "*.app" -type d 2>/dev/null || true
            echo "--- last 50 lines of xcodebuild log ---"
            tail -50 "$RUNNER_TEMP/xcodebuild.log" || true
            exit 1
          fi

          echo "Found .app at: $APP_PATH"
          ls -la "$APP_PATH"

          # Verify it contains a real binary, not just an empty shell
          BINARY="$APP_PATH/RingerGoBRRR"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: App binary missing inside .app bundle."
            ls -la "$APP_PATH"
            exit 1
          fi

          BINARY_SIZE=$(wc -c < "$BINARY")
          echo "Binary size: $BINARY_SIZE bytes"
          if [ "$BINARY_SIZE" -lt 10000 ]; then
            echo "ERROR: Binary is suspiciously small ($BINARY_SIZE bytes). Build likely failed silently."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"

      # ── 6. Package into .ipa ──────────────────────────────────────────────
      # An .ipa is exactly: zip of a Payload/ directory containing the .app.
      - name: Package .ipa
        id: package_ipa
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.locate_app.outputs.APP_PATH }}"
          STAGING="$RUNNER_TEMP/ipa_staging"
          IPA_PATH="$RUNNER_TEMP/RingerGoBRRR-unsigned.ipa"

          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -r "$APP_PATH" "$STAGING/Payload/RingerGoBRRR.app"

          cd "$STAGING"
          zip -r "$IPA_PATH" Payload/ -x "*.DS_Store"

          IPA_SIZE=$(wc -c < "$IPA_PATH")
          echo "IPA size: $IPA_SIZE bytes"

          if [ "$IPA_SIZE" -lt 50000 ]; then
            echo "ERROR: IPA is too small ($IPA_SIZE bytes). Something went wrong with packaging."
            exit 1
          fi

          ls -lh "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_OUTPUT"

      # ── 7. Upload .ipa artifact ───────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RingerGoBRRR-unsigned-ipa
          path: ${{ steps.package_ipa.outputs.IPA_PATH }}
          if-no-files-found: error    # fails the job if the file is missing
          retention-days: 30

      # ── 8. Upload xcodebuild log (always, for debugging) ──────────────────
      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      # ── 9. Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          IPA="${{ steps.package_ipa.outputs.IPA_PATH }}"
          IPA_SIZE=$(wc -c < "$IPA")
          IPA_SIZE_KB=$(( IPA_SIZE / 1024 ))

          echo "============================================"
          echo "  RINGER GO BRRR — Build Successful"
          echo "============================================"
          echo "  IPA: RingerGoBRRR-unsigned.ipa"
          echo "  Size: ${IPA_SIZE_KB} KB"
          echo ""
          echo "  To install on your iPhone 15:"
          echo "  1. Download artifact: RingerGoBRRR-unsigned-ipa"
          echo "  2. Open Sideloadly on Windows"
          echo "  3. Connect iPhone via USB"
          echo "  4. Drag the .ipa into Sideloadly"
          echo "  5. Enter your Apple ID (free account works)"
          echo "  6. Sideloadly signs and installs the app"
          echo "  7. iPhone: Settings > General >"
          echo "     VPN & Device Management > Trust your Apple ID"
          echo ""
          echo "  NOTE: Free Apple ID profiles expire in 7 days."
          echo "============================================"
